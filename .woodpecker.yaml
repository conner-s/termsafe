# Woodpecker CI for termsafe, a Go module with no dependencies.
#
# Runs on pushes to main, on pull requests and when started by hand. This is
# the gate a pull request has to pass. The jobs that need runners this forge
# does not have, Windows and macOS, run after the merge, on the GitHub mirror:
# .github/workflows/mirror.yml.
#
# There is no publish step: the forge pushes main to the mirror, and Go
# fetches a tagged version from there.

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

# Custom clone step to use the custom SSL certificate for Forgejo
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      custom-ssl-path: /var/run/autocert.step.sm/root.crt

steps:
  lint:
    image: golang:1.27-bookworm
    commands:
      - go vet ./...
      # The Windows half of the terminal check is compiled nowhere else.
      - GOOS=windows GOARCH=amd64 go vet ./...
      - test -z "$(gofmt -l .)" || (echo "Not formatted. Run 'gofmt -w .'" && gofmt -l . && exit 1)
      # Standard library only: the module graph is this module and nothing else.
      - test "$(go list -m all)" = "github.com/conner-s/termsafe"

  test:
    image: golang:1.27-bookworm
    commands:
      # Which Unicode version this Go release carries, for the log.
      - go test -run '^TestUnicodeVersion$' -v .
      # The profile goes outside the tree, so the repository needs no .gitignore
      # for go mod vendor to copy into every program that imports it.
      - go test -race -coverprofile=/tmp/coverage.out ./...
      # Every statement of the package is covered, and stays so.
      - go tool cover -func=/tmp/coverage.out | tail -1
      - go tool cover -func=/tmp/coverage.out | tail -1 | grep -q '100.0%'

  # The same tests on Go 1.26, the release of go.mod's go directive. Its
  # Unicode tables are older (15.0, where 1.27 has 17.0), and what counts as
  # a letter, a symbol or an ideograph comes from them. Programs built with
  # that release get this behaviour.
  #
  # Keep this step until Go 1.26 is no longer supported. Go supports a release
  # until there are two newer ones (go.dev/doc/devel/release, "Release
  # Policy"), so that is the day Go 1.28 is released. Then remove the step,
  # remove the rule in renovate.json that holds this image, and raise the go
  # directive.
  test-oldest-go:
    image: golang:1.26-bookworm
    commands:
      - go test -run '^TestUnicodeVersion$' -v .
      - go test -race ./...

  fuzz:
    image: golang:1.27-bookworm
    commands:
      - go test -run='^$' -fuzz='^FuzzClean$' -fuzztime=30s .
